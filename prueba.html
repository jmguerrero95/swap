<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Vida - KYC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f7fa;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 900px;
            max-height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3); 
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        #instruction {
            position: absolute;
            bottom: 20px;
            width: 90%;
            max-width: 700px;
            text-align: center;
            font-size: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            font-family: 'Arial', sans-serif;
        }

        #progress {
            position: absolute;
            top: 20px;
            width: 100%;
            max-width: 700px;
            text-align: center;
            font-size: 16px;
            color: white;
        }

        .progress-bar {
            height: 8px;
            background-color: #4CAF50;
            width: 0%;
            border-radius: 5px;
            transition: width 0.5s ease-in-out;
        }

        #thankyou {
            margin-top: 20px;
            font-size: 24px;
            color: #333;
            font-family: 'Arial', sans-serif;
            display: none;
        }

        #uploadingMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            color: white;
            font-size: 20px;
            text-align: center;
            display: none;
        }

        #uploadingProgress {
            height: 8px;
            background-color: #2196F3;
            width: 0%;
            border-radius: 5px;
            margin-top: 10px;
            transition: width 1s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="instruction">Por favor, siga las instrucciones en la pantalla.</div>
        <div id="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div id="thankyou">¡Gracias por completar la verificación!</div>
    </div>
    <div id="uploadingMessage">
        <div>Enviando los datos...</div>
        <div id="uploadingProgress"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const instructionText = document.getElementById('instruction');
        const progressBar = document.getElementById('progress-bar');
        const thankyouMessage = document.getElementById('thankyou');
        const uploadingMessage = document.getElementById('uploadingMessage');
        const uploadingProgress = document.getElementById('uploadingProgress');
        let model;
        let step = 0;
        let mediaRecorder;
        let recordedChunks = [];
        let capturedImageUrl = ""; // Guardamos la URL de la imagen capturada
        let videoBlob;

        const instructions = [
            "Gire la cabeza a la izquierda.",
            "Gire la cabeza a la derecha.",
            "Gire la cabeza hacia arriba.",
            "Gire la cabeza hacia abajo."
        ];

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video.play());
                };
            });
        }

        async function loadModel() {
            model = faceLandmarksDetection.SupportedModels.MediaPipeFaceMesh;
            const detectorConfig = {
                runtime: 'mediapipe',
                solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh',
            };
            model = await faceLandmarksDetection.createDetector(model, detectorConfig);
        }

        function drawMesh(predictions) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (predictions.length > 0) {
                predictions.forEach(prediction => {
                    const keypoints = prediction.keypoints;
                    keypoints.forEach(keypoint => {
                        const {x, y} = keypoint;
                        ctx.beginPath();
                        ctx.arc(x, y, 2, 0, 2 * Math.PI);
                        ctx.fillStyle = 'red';
                        ctx.fill();
                    });
                });
            }
        }

        async function detectFace() {
            if (!model) {
                console.error("Modelo no cargado. No se puede detectar la cara.");
                return;
            }

            try {
                const predictions = await model.estimateFaces(video);
                drawMesh(predictions);
                checkDirection(predictions);
            } catch (error) {
                console.error("Error al estimar caras:", error);
            }

            requestAnimationFrame(detectFace);
        }

        function checkDirection(predictions) {
            if (predictions.length > 0 && step < instructions.length) {
                const keypoints = predictions[0].keypoints;
                const nose = keypoints[1]; // Nariz
                const leftEye = keypoints[33]; // Esquina izquierda del ojo izquierdo
                const rightEye = keypoints[263]; // Esquina derecha del ojo derecho
                const mouthLeft = keypoints[61]; // Boca izquierda
                const mouthRight = keypoints[291]; // Boca derecha

                const eyeDistance = rightEye.x - leftEye.x;
                const headTurnThreshold = eyeDistance * 0.2; // Reducido a 20%

                // Verificar si se mira a la derecha
                if (step === 0 && nose.x > rightEye.x + headTurnThreshold) {
                    step++;
                    instructionText.textContent = instructions[step];
                    updateProgress();
                }
                // Verificar si se mira a la izquierda
                else if (step === 1 && nose.x < leftEye.x - headTurnThreshold) {
                    step++;
                    instructionText.textContent = instructions[step];
                    updateProgress();
                }
                // Verificar si se mira hacia arriba
                else if (step === 2 && nose.y < Math.min(leftEye.y, rightEye.y) - headTurnThreshold * 0.2) {
                    step++;
                    instructionText.textContent = instructions[step];
                    updateProgress();
                }
                // Verificar si se mira hacia abajo
                else if (step === 3 && nose.y > Math.max(leftEye.y, rightEye.y) + headTurnThreshold * 3) {
                    instructionText.textContent = "Por favor, mire de frente para capturar su imagen.";
                    updateProgress(true);
                }
            }
        }

        function updateProgress(final = false) {
            const progress = (step / instructions.length) * 100;
            progressBar.style.width = `${progress}%`;

            if (final) {
                setTimeout(() => {
                    progressBar.classList.add('complete');
                    progressBar.style.width = '100%';
                    captureImage();
                    startRecording();
                    hideCameraAndShowUploading();
                }, 1000);
            }
        }

        function startRecording() {
            const stream = video.srcObject;
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (event) => {
                recordedChunks.push(event.data);
            };
            mediaRecorder.onstop = () => {
                videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
            };
            mediaRecorder.start();
        }

        function captureImage() {
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = video.videoWidth;
            captureCanvas.height = video.videoHeight;
            const captureCtx = captureCanvas.getContext('2d');
            captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);

            capturedImageUrl = captureCanvas.toDataURL('image/png');
        }

        function hideCameraAndShowUploading() {
            video.style.display = 'none'; // Ocultar la cámara
            uploadingMessage.style.display = 'block'; // Mostrar mensaje de carga
            sendFilesToServer(); // Enviar imagen y video al servidor
        }

        async function sendFilesToServer() {
            const formData = new FormData();
            formData.append('image', dataURLtoFile(capturedImageUrl, 'image_kyc.png'));
            formData.append('video', videoBlob, 'video_kyc.webm');

            try {
                const response = await axios.post('https://your-server-url.com/upload', formData, {
                    headers: {
                        'Content-Type': 'multipart/form-data',
                    },
                    onUploadProgress: (progressEvent) => {
                        if (progressEvent.lengthComputable) {
                            let percentCompleted = Math.round((progressEvent.loaded * 100) / progressEvent.total);
                            uploadingProgress.style.width = `${percentCompleted}%`;
                        }
                    }
                });

                if (response.status === 200) {
                    uploadingMessage.innerHTML = '¡Datos enviados correctamente!';
                    setTimeout(() => {
                        thankyouMessage.style.display = 'block'; // Mostrar mensaje de agradecimiento
                    }, 2000);
                }
            } catch (error) {
                console.error('Error al enviar los archivos:', error);
                uploadingMessage.innerHTML = 'Error al enviar los datos.';
            }
        }

        function dataURLtoFile(dataUrl, filename) {
            const arr = dataUrl.split(','),
                mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]),
                n = bstr.length,
                u8arr = new Uint8Array(n);

            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }

            return new File([u8arr], filename, { type: mime });
        }

        async function init() {
            await setupCamera();
            await loadModel();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            instructionText.textContent = "Por favor, siga las instrucciones en la pantalla.";
            setTimeout(() => {
                instructionText.style.opacity = 0;
                setTimeout(() => {
                    instructionText.style.opacity = 1;
                    instructionText.textContent = instructions[step];
                }, 1000);
            }, 2000);

            detectFace(); // Comenzamos a detectar la cara
        }

        init().catch(error => {
            console.error("Error en la inicialización:", error);
        });
    </script>
</body>
</html>
